name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=${JAVA_HOME}"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java string: ${JAVA_VER}"
          JAVA_MAJOR=$(echo "${JAVA_VER}" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ -z "${JAVA_MAJOR}" ]; then
            echo "Error: Could not detect Java major version."
            exit 1
          fi
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "Error: Java major version is ${JAVA_MAJOR}, which is lower than 17."
            exit 1
          fi
          echo "Java environment verified: Java ${JAVA_MAJOR} (>= 17)"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore confirmed present."

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "Error: Expected APK not found at ${EXPECTED_APK}"
            echo "Searching only inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "Error: APK file ${EXPECTED_APK} is empty."
            exit 1
          fi
          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "Error: File does not have .apk extension."
              exit 1
              ;;
          esac
          echo "Verified APK: ${EXPECTED_APK} (Size: $(stat -c%s "${EXPECTED_APK}") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "${TMP_DIR}/app-debug.apk"
          if [ ! -s "${TMP_DIR}/app-debug.apk" ]; then
            echo "Error: Failed to prepare ${TMP_DIR}/app-debug.apk"
            exit 1
          fi
          echo "asset_path=${TMP_DIR}/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${TMP_DIR}/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          gh --version || { echo "Error: GitHub CLI is not available"; exit 1; }
          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "Error: Prepared APK is missing or empty at ${ASSET_PATH}"
            exit 1
          fi
          case "${ASSET_PATH}" in
            */app-debug.apk) ;;
            *)
              echo "Error: Asset filename is not exactly app-debug.apk"
              exit 1
              ;;
          esac
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          - GitHub Actions Run Number: ${{ github.run_number }}
          - GitHub Actions Run Attempt: ${{ github.run_attempt }}
          - Source Commit SHA: ${{ github.sha }}

          Note: This APK is intended for testing.
          It is not a Play Store production release.
          The APK is signed only with a temporary debug keystore.
          EOF
          )
          echo "Creating GitHub Release with tag: ${TAG}"
          gh release create "${TAG}" "${ASSET_PATH}" \
            --title "${TITLE}" \
            --notes "${NOTES}" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Succeeded ==="
            gh release view "${TAG}" || true
            echo "Release Tag: ${TAG}"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "APK Filename: app-debug.apk"
            echo "Direct Download URL: ${DIRECT_URL}"
            echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "[Download app-debug.apk](${DIRECT_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The normal Actions artifact 'app-debug-apk' remains available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not succeed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "APK build succeeded. The GitHub Actions artifact 'app-debug-apk' remains available as a backup."
            fi
          fi
